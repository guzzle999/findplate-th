<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>🔎 ตามหาป้ายทะเบียน</title>

  <meta
    name="description"
    content="ระบบช่วยแจ้งและค้นหาป้ายทะเบียนที่สูญหายจากเหตุการณ์น้ำท่วม"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #f5f7fb;
    }

    body {
      overflow: hidden;
    }

    .app {
      width: 100%;
      height: 100vh;
      min-height: 100vh;
      background: white;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 100vh;
      border: 0;
    }

    .loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: white;
      z-index: 10;
      font-family: system-ui, sans-serif;
      color: #333;
      pointer-events: none;
      animation: hideLoading 1s forwards;
      animation-delay: 2s;
    }

    .loading-box {
      text-align: center;
    }

    .loading-icon {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .loading-text {
      font-size: 16px;
    }

    @keyframes hideLoading {
      to {
        opacity: 0;
        visibility: hidden;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <iframe
      src="https://script.google.com/macros/s/AKfycbwVxe40N1THkbE1emBsKQsIq_9-5cm6CXf9kX_kOvF7Np8Rp3duuUkYgP3XMoryd1w-/exec"
      title="ตามหาป้ายทะเบียน"
      allow="geolocation"
    ></iframe>

  </div>

  <div class="loading">
    <div class="loading-box">
      <div class="loading-icon">🔎</div>
      <div class="loading-text">
        กำลังเปิดระบบตามหาป้ายทะเบียน...
      </div>
    </div>
  </div>

</body>
</html>
